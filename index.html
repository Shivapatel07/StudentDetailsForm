<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 14px; }
    input { width: 100%; padding: 9px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Student Details Form</h2>
  <form id="studentForm" novalidate>
    <label for="name">Student Name *</label>
    <input id="name" type="text" required>

    <label for="email">Email *</label>
    <input id="email" type="email" required>

    <label for="roll">Roll Number *</label>
    <input id="roll" type="text" required>

    <label for="department">Department *</label>
    <input id="department" type="text" required>

    <button type="submit">Submit</button>
  </form>
  <p id="message" role="status"></p>

  <script>
    document.getElementById("studentForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const roll = document.getElementById("roll").value.trim();
      const department = document.getElementById("department").value.trim();
      const message = document.getElementById("message");

      if (!name || !email || !roll || !department) {
        message.textContent = "Please fill all mandatory fields.";
        message.style.color = "red";
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message.textContent = "Please enter a valid email address.";
        message.style.color = "red";
        return;
      }
      message.textContent = "Student details submitted successfully!";
      message.style.color = "green";
    });
  </script>
</body>
</html>
